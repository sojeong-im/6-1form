<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소모임 신청 폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .fade-enter { opacity: 0; transform: translateX(20px); }
        .fade-enter-active { opacity: 1; transform: translateX(0); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-200">

    <!-- Form Container -->
    <div x-data="formApp()" class="w-full max-w-lg bg-white rounded-[2rem] shadow-2xl shadow-indigo-100/50 overflow-hidden relative min-h-[550px] flex flex-col border border-slate-100">
        
        <!-- Progress Bar -->
        <div class="h-1.5 w-full bg-slate-100 absolute top-0 left-0">
            <div class="h-full bg-indigo-600 transition-all duration-700 ease-in-out" 
                 :style="`width: ${((step) / (totalSteps + 1)) * 100}%`"></div>
        </div>

        <div class="p-10 flex-grow flex flex-col justify-center relative overflow-hidden mt-4">
            
            <!-- Step 1: Name -->
            <div x-show="step === 1" x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter" class="space-y-8 absolute w-full pr-20" style="display: none;">
                <div>
                    <span class="text-indigo-600 font-bold tracking-widest text-xs uppercase mb-3 block">Step 1</span>
                    <h2 class="text-3xl font-extrabold leading-tight tracking-tight">반갑습니다! 👋<br>먼저, 이름을 알려주세요.</h2>
                </div>
                <div class="space-y-4">
                    <input type="text" x-model="formData.name" @keydown.enter.prevent="nextStep()" placeholder="예: 홍길동" class="w-full text-2xl py-4 border-b-2 border-slate-200 focus:border-indigo-600 focus:outline-none bg-transparent transition-colors placeholder:text-slate-300">
                </div>
            </div>

            <!-- Step 2: Purpose (Card UI) -->
            <div x-show="step === 2" x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter" class="space-y-8 absolute w-full pr-20" style="display: none;">
                <div>
                    <span class="text-indigo-600 font-bold tracking-widest text-xs uppercase mb-3 block">Step 2</span>
                    <h2 class="text-3xl font-extrabold leading-tight tracking-tight">소모임에 참여하시는<br>주된 목적이 무엇인가요?</h2>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <template x-for="purpose in purposes" :key="purpose.id">
                        <label class="cursor-pointer group">
                            <input type="radio" x-model="formData.purpose" :value="purpose.id" class="peer sr-only">
                            <div class="p-6 border-2 border-slate-100 rounded-2xl text-center group-hover:border-indigo-300 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700 transition-all duration-200">
                                <div class="text-4xl mb-3 transform group-hover:scale-110 transition-transform duration-200" x-text="purpose.emoji"></div>
                                <div class="font-bold text-slate-600 peer-checked:text-indigo-700" x-text="purpose.title"></div>
                            </div>
                        </label>
                    </template>
                </div>
            </div>

            <!-- Step 3: Expectation -->
            <div x-show="step === 3" x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter" class="space-y-8 absolute w-full pr-20" style="display: none;">
                <div>
                    <span class="text-indigo-600 font-bold tracking-widest text-xs uppercase mb-3 block">Step 3</span>
                    <h2 class="text-3xl font-extrabold leading-tight tracking-tight">우리 소모임에서<br>어떤 것을 기대하시나요?</h2>
                    <p class="text-slate-500 mt-2 font-medium">자유롭게 작성해주세요. (선택)</p>
                </div>
                <textarea x-model="formData.expectation" rows="4" class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-600 focus:bg-white focus:outline-none resize-none transition-colors text-lg" placeholder="예: 새로운 사람들과 즐겁게 소통하고 싶어요!"></textarea>
            </div>

            <!-- Step 4: Complete -->
            <div x-show="step === 4" x-transition:enter="fade-enter-active" x-transition:enter-start="fade-enter" class="space-y-6 text-center w-full" style="display: none;">
                <div class="text-7xl mb-6 animate-bounce">🎉</div>
                <h2 class="text-3xl font-extrabold tracking-tight text-slate-800">신청이 완료되었습니다!</h2>
                <p class="text-slate-500 font-medium leading-relaxed">소모임에 대한 자세한 내용이 확정되면<br>입력해주신 정보로 안내해 드릴게요.</p>
                <div class="mt-8 p-6 bg-slate-50 border border-slate-100 rounded-2xl inline-block text-left w-full shadow-inner">
                    <p class="font-bold text-slate-700 mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        작성 내역 요약
                    </p>
                    <ul class="space-y-2 text-slate-600">
                        <li class="flex justify-between items-center py-1 border-b border-slate-200 border-dashed">
                            <span class="font-medium">이름</span> 
                            <span class="font-bold text-slate-800" x-text="formData.name"></span>
                        </li>
                        <li class="flex justify-between items-center py-1">
                            <span class="font-medium">주요 목적</span> 
                            <span class="font-bold text-slate-800" x-text="purposes.find(p => p.id === formData.purpose)?.title || '-'"></span>
                        </li>
                    </ul>
                </div>
            </div>

        </div>

        <!-- Navigation Buttons -->
        <div class="p-10 pt-4 flex justify-between items-center bg-white z-10" x-show="step < 4">
            <button @click="prevStep" :class="{ 'opacity-0 pointer-events-none': step === 1 }" class="px-2 py-3 text-slate-400 font-bold hover:text-slate-700 transition-all flex items-center gap-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                이전
            </button>
            <button @click="nextStep" :disabled="!canProceed()" class="group px-8 py-4 bg-indigo-600 text-white font-bold rounded-2xl hover:bg-indigo-700 disabled:opacity-40 disabled:hover:bg-indigo-600 transition-all shadow-xl shadow-indigo-200/50 flex items-center gap-2">
                <span x-text="step === totalSteps ? '제출하기' : '다음으로'"></span>
                <svg x-show="step < totalSteps" class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <svg x-show="step === totalSteps" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </button>
        </div>
        
    </div>

    <script>
        function formApp() {
            return {
                step: 1,
                totalSteps: 3, 
                purposes: [
                    { id: 'network', emoji: '🤝', title: '인맥 형성' },
                    { id: 'study', emoji: '📚', title: '자기계발' },
                    { id: 'hobby', emoji: '🎨', title: '취미 공유' },
                    { id: 'fun', emoji: '✨', title: '단순 친목' }
                ],
                formData: {
                    name: '',
                    purpose: '',
                    expectation: ''
                },
                init() {
                    // Set initial display explicitly for Alpine transitions
                    this.$watch('step', value => {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                },
                canProceed() {
                    if (this.step === 1) return this.formData.name.trim().length > 0;
                    if (this.step === 2) return this.formData.purpose !== '';
                    return true;
                },
                nextStep() {
                    if (this.canProceed() && this.step <= this.totalSteps) {
                        this.step++;
                    }
                },
                prevStep() {
                    if (this.step > 1) {
                        this.step--;
                    }
                }
            }
        }
    </script>
</body>
</html>
